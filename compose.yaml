name: traceforge

services:
  traceforge:
    image: traceforge-web:local
    build:
      context: .
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://deb.debian.org/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-https://deb.debian.org/debian-security}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TRACEFORGE_PORT:-8000}:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_BRIEF_MODEL: ${OPENAI_BRIEF_MODEL:-}
      OPENAI_FALLBACK_MODEL: ${OPENAI_FALLBACK_MODEL:-}
      TRACEFORGE_DATA_DIR: /data
      TRACEFORGE_CONFIG_DIR: /config
      TRACEFORGE_INITIAL_WORKSPACE: ${TRACEFORGE_INITIAL_WORKSPACE:-/projects/default}
      TRACEFORGE_CONTEXT_WINDOW: ${TRACEFORGE_CONTEXT_WINDOW:-128000}
      TRACEFORGE_RESERVE_TOKENS: ${TRACEFORGE_RESERVE_TOKENS:-16384}
      TRACEFORGE_MAX_AGENT_ROUNDS: ${TRACEFORGE_MAX_AGENT_ROUNDS:-50}
      TRACEFORGE_COMMAND_TIMEOUT: ${TRACEFORGE_COMMAND_TIMEOUT:-120}
      TRACEFORGE_APPROVAL_TIMEOUT: ${TRACEFORGE_APPROVAL_TIMEOUT:-600}
      TRACEFORGE_MAX_RUN_TOKENS: ${TRACEFORGE_MAX_RUN_TOKENS:-0}
      TRACEFORGE_MAX_RUN_COST_USD: ${TRACEFORGE_MAX_RUN_COST_USD:-0}
      TRACEFORGE_INPUT_USD_PER_1M: ${TRACEFORGE_INPUT_USD_PER_1M:-0}
      TRACEFORGE_OUTPUT_USD_PER_1M: ${TRACEFORGE_OUTPUT_USD_PER_1M:-0}
    volumes:
      - data:/data
      - config:/config
      - projects:/projects
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
      - /home/traceforge:rw,nosuid,nodev,size=128m,uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    # Bubblewrap needs nested unprivileged namespaces. No privileged mode,
    # SYS_ADMIN capability, Docker socket, or host-root mount is used.
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined
      - apparmor:unconfined
    pids_limit: 512
    mem_limit: 4g
    cpus: 2
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=12)); assert r['sandbox']['ready'], r['sandbox']['reason']"]
      interval: 30s
      timeout: 15s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  proxy:
    image: caddy:2.10-alpine
    # Incoming ports belong to traceforge's network namespace. Caddy connects
    # to 127.0.0.1:8001 so model-settings retain their local-connection guard.
    network_mode: "service:traceforge"
    depends_on:
      traceforge:
        condition: service_started
        restart: true
    restart: unless-stopped
    volumes:
      - ./infra/deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - proxy_data:/data
      - proxy_config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
  config:
  projects:
  proxy_data:
  proxy_config:
